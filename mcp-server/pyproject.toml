[project]
name = "jottit-mcp"
version = "0.1.0"
description = "MCP server for Jottit"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
jottit-mcp = "jottit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
