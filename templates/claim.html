{% extends "base.html" %}

{% block title %}Claim this page — Jottit{% endblock %}

{% block head %}{% endblock %}

{% block body %}
<div class="shell shell-centered">
    <h1 class="title">What's your email?</h1>
    <p class="subtitle">We'll send you a passcode</p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form class="auth-form" method="post" action="/{{ slug }}/claim">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input class="auth-input" type="email" name="email" autocomplete="email" required autofocus>
        <button class="btn btn-outline" type="submit">Claim</button>
    </form>
</div>
{% endblock %}
