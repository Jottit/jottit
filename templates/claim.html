{% extends "base.html" %}

{% block title %}Claim this page — Jottit{% endblock %}

{% block body %}
<div class="shell shell-centered">
    <h1 class="title">Claim this page</h1>
    <p class="subtitle">Enter your email to get started.</p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form class="auth-form" method="post" action="/{{ slug }}/claim">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="email" class="sr-only">Email address</label>
        <input class="auth-input" type="email" name="email" id="email" value="{{ email or '' }}" required autofocus>
        <button class="btn btn-solid" type="submit">Send code</button>
    </form>
</div>
{% endblock %}
