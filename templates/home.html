{% extends "base.html" %}

{% block body %}
<div class="home">
    {% if signed_in %}
    <a href="/signout" class="signin-link">Sign out</a>
    {% else %}
    <a href="/signin" class="signin-link">Sign in</a>
    {% endif %}

    <main class="home-main">
        <h1 class="logo">Jottit</h1>
        <p class="tagline">The fastest way to publish on the web.</p>
        <a href="/new" class="btn btn-solid btn-lg mb-2">Create a page</a>
        {% if sites %}
        <a href="/sites" class="btn btn-outline">My sites</a>
        {% endif %}
    </main>

    {% include "_footer.html" %}
</div>
{% endblock %}
