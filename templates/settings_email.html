{% extends "base.html" %}

{% block title %}Email — Jottit{% endblock %}

{% block body %}
<div class="panel-page">
    <a href="/settings" class="panel-back">&larr; Settings</a>
    <h1 class="title">Email</h1>
    <div class="panel">

        {% for message in get_flashed_messages() %}
        <p class="notice notice--success">{{ message }}</p>
        {% endfor %}
        {% if error %}
        <p class="notice notice--error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/settings/email">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input" type="email" id="email" name="email" value="{{ user.email }}" placeholder="you@example.com">
            </div>

            <button type="submit" class="btn btn-solid settings-save">Save</button>
        </form>
    </div>
    <a href="/settings/delete" class="settings-delete-link">Delete account</a>
</div>
{% endblock %}
