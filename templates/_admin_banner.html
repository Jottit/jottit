<div class="admin-banner">
    <a href="{{ base_url|default('/', true) }}" class="admin-banner-home">Jottit</a>
    <div class="admin-banner-actions">
        <a href="{{ url_prefix }}/new" class="btn btn-publish btn--sm">Write</a>
        {% if owner_avatar_url %}
        <a href="{{ base_url|default('', true) }}/settings" title="Settings"><img src="{{ owner_avatar_url }}" alt="Settings" class="admin-avatar-img"></a>
        {% else %}
        <a href="{{ base_url|default('', true) }}/settings" class="admin-avatar{% if profile_incomplete %} profile-incomplete{% endif %}" title="Settings">{{ owner_initials }}</a>
        {% endif %}
    </div>
</div>
