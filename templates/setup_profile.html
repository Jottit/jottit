{% extends "base.html" %}

{% block title %}Set up your profile — Jottit{% endblock %}

{% block body %}
<div class="shell shell-centered">
    <header class="home-header">
        <a href="/" class="home-header-logo logo">Jottit</a>
        <span class="signin-link">Already have an account? <a href="/signin">Sign in</a></span>
    </header>
    <h1 class="title">Almost there, @{{ username }}</h1>
    <p class="subtitle">Add a photo and name so people know who you are.</p>
    <form class="auth-form" method="post" action="/setup/profile" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="setup-profile-card">
            <div class="setup-avatar-upload">
                <div class="setup-avatar-preview" id="avatar-preview">
                    <span class="setup-avatar-initials">{{ username[0] | upper }}</span>
                </div>
                <label class="setup-avatar-label" for="avatar-file">Upload photo</label>
                <input type="file" id="avatar-file" name="avatar" accept="image/jpeg,image/png,image/gif,image/webp" class="sr-only">
            </div>
            <div class="setup-profile-fields">
                <input class="setup-name-input" type="text" name="name" placeholder="Your name" autofocus>
                <div class="setup-username-display">@{{ username }}</div>
            </div>
        </div>
        <div class="setup-profile-actions">
            <button class="btn btn-solid" type="submit">Save and continue</button>
            <a href="/@{{ username }}" class="setup-skip-link">Skip for now →</a>
        </div>
    </form>
</div>
<script src="/static/setup-profile.js?v={{ asset_v }}" defer></script>
{% endblock %}
