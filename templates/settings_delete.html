{% extends "base.html" %}

{% block title %}Delete account — Jottit{% endblock %}

{% block body %}
<div class="panel-page">
    <a href="/settings" class="panel-back">&larr; Settings</a>
    <h1 class="title">Delete account</h1>
    <div class="panel panel--compact">
        <p class="danger-confirm-text">This will permanently delete your account and unlink all your pages. This cannot be undone.</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/settings/delete" class="delete-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="confirm" class="delete-confirm-label">Type <strong>delete</strong> to confirm</label>
            <input type="text" id="confirm" name="confirm" class="input" autocomplete="off" autofocus>
            <div class="delete-form-actions">
                <button type="submit" class="btn btn-danger">Delete my account</button>
                <a href="/settings" class="btn btn--outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
