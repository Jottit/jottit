{% if site_title %}
<header class="site-header">
    <div class="site-header-inner">
        <div class="site-header-spacer">
            <a href="{{ base_url|default('/', true) }}" class="site-header-logo">Jottit</a>
        </div>
        <div class="site-header-center"></div>
        <div class="site-header-spacer">
            {% if is_owner %}
            <div class="site-header-actions">
                <a href="{{ url_prefix }}/new" class="btn btn-publish btn--sm site-header-create">Create a page</a>
                <a href="{{ base_url|default('', true) }}/settings" class="site-header-avatar-link" title="Settings">{% if owner_avatar_url %}<img src="{{ owner_avatar_url }}" alt="" class="site-header-user-avatar">{% elif owner_initials %}<span class="site-header-user-initials">{{ owner_initials }}</span>{% endif %}</a>
            </div>
            {% else %}
            <div class="site-header-actions">
                <a href="{{ base_url|default('', true) }}/signin" class="site-header-settings-link">Sign in</a>
                <a href="{{ base_url|default('', true) }}/new" class="btn btn--outline btn--sm">Create a page</a>
            </div>
            {% endif %}
        </div>
    </div>
</header>
{% endif %}
