{% extends "base.html" %}

{% block title %}Enter code — Jottit{% endblock %}

{% block body %}
<div class="shell shell-centered">
    <h1 class="title">Check your email</h1>
    <p class="subtitle">We sent you a 6-digit code.</p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form class="auth-form" method="post" action="{{ action }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="code" id="code-value">
        {% if email %}<input type="hidden" name="email" value="{{ email }}">{% endif %}
        <div class="code-inputs">
            <label for="code-digit-1" class="sr-only">Digit 1</label>
            <input class="auth-input auth-code-digit" type="text" id="code-digit-1" inputmode="numeric" maxlength="1" pattern="[0-9]" required autofocus>
            <label for="code-digit-2" class="sr-only">Digit 2</label>
            <input class="auth-input auth-code-digit" type="text" id="code-digit-2" inputmode="numeric" maxlength="1" pattern="[0-9]" required>
            <label for="code-digit-3" class="sr-only">Digit 3</label>
            <input class="auth-input auth-code-digit" type="text" id="code-digit-3" inputmode="numeric" maxlength="1" pattern="[0-9]" required>
            <label for="code-digit-4" class="sr-only">Digit 4</label>
            <input class="auth-input auth-code-digit" type="text" id="code-digit-4" inputmode="numeric" maxlength="1" pattern="[0-9]" required>
            <label for="code-digit-5" class="sr-only">Digit 5</label>
            <input class="auth-input auth-code-digit" type="text" id="code-digit-5" inputmode="numeric" maxlength="1" pattern="[0-9]" required>
            <label for="code-digit-6" class="sr-only">Digit 6</label>
            <input class="auth-input auth-code-digit" type="text" id="code-digit-6" inputmode="numeric" maxlength="1" pattern="[0-9]" required>
        </div>
        <button class="btn btn--outline" type="submit">Verify</button>
    </form>
    <script src="/static/verify.js?v={{ asset_v }}"></script>
</div>
{% endblock %}
