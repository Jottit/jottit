{% extends "base.html" %}

{% block title %}Revision #{{ revision }} — Jottit{% endblock %}

{% block head %}{% endblock %}

{% block body %}
<div class="revision-banner">
    You're viewing revision #{{ revision }} from {{ created_at | relative_time }}.
    <a href="{{ site_path(slug, page_slug) }}">View current version</a>
</div>
<main class="page-main">
    <article class="page">
        {{ content | safe }}
    </article>
    <footer class="page-footer">
        <span>powered by <a href="/">Jottit</a></span>
    </footer>
</main>
{% endblock %}
