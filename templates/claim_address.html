{% extends "base.html" %}

{% block title %}Pick your address — Jottit{% endblock %}

{% block body %}
<div class="shell shell-centered">
    <h1 class="title">Next, pick your address</h1>
    <form class="auth-form" method="post" action="/{{ slug }}/claim/address">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="auth-subdomain-row">
            <input class="auth-input" type="text" name="username" value="{{ username or '' }}" required autofocus>
            <span class="auth-subdomain-suffix">.jottit.org</span>
        </div>
        <p class="auth-subdomain-notice">{% if error %}{{ error }}{% endif %}</p>
        <button class="btn btn-solid" type="submit">Finish</button>
    </form>
    <script src="/static/check-username.js?v={{ asset_v }}"></script>
</div>
{% endblock %}
