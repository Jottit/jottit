{% extends "base.html" %}

{% block title %}Sign in — Jottit{% endblock %}

{% block head %}{% endblock %}

{% block body %}
<div class="auth-page">
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-subtitle">Enter your email to sign in.</p>
    {% if error %}
    <p class="auth-error">{{ error }}</p>
    {% endif %}
    <form class="auth-form" method="post" action="/signin">
        <input class="auth-input" type="email" name="email" placeholder="you@example.com" required autofocus>
        <button class="btn btn-solid" type="submit">Send code</button>
    </form>
</div>
{% endblock %}
