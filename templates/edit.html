{% extends "base.html" %}

{% block title %}Edit — Jottit{% endblock %}

{% block head %}
<script src="/static/marked.min.js?v={{ asset_v }}"></script>
<script src="/static/purify.min.js?v={{ asset_v }}"></script>
{% endblock %}

{% block body %}
<div class="editor" data-slug="{{ slug or '' }}">
    <div class="editor-split">
        <div class="editor-pane">
            <form id="editor-form" class="editor-form" method="post" action="{% if slug %}{{ url_prefix }}/{{ slug }}/edit{% else %}{{ url_prefix }}/new{% endif %}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="title" class="sr-only">Title</label>
                <input class="editor-title" id="title" type="text" name="title" placeholder="Title" value="{{ title }}" {% if not title %}autofocus{% endif %}>
                <label for="content" class="sr-only">Content</label>
                <textarea class="editor-content" id="content" name="content" placeholder="Write something...&#10;&#10;**bold**  *italic*  [link](url)  ## heading" {% if title and not content %}autofocus{% endif %}>{{ content }}</textarea>
            </form>
        </div>
        <div class="editor-preview" inert>
            <article class="page" id="preview"></article>
        </div>
    </div>
    <footer class="editor-footer">
        <a href="https://commonmark.org/help/" target="_blank" class="editor-markdown-link" tabindex="-1">Markdown</a>
        <div class="editor-actions">
            <button class="btn btn-publish" type="submit" form="editor-form">Publish</button>
            <a href="{% if is_new %}/{% else %}{{ url_prefix }}/{{ slug }}{% endif %}" class="btn btn--outline">Cancel</a>
        </div>
    </footer>
</div>
<script src="/static/editor.js?v={{ asset_v }}"></script>
{% endblock %}
