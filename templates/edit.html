{% extends "base.html" %}

{% block title %}Edit — Jottit{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
{% endblock %}

{% block body %}
<div class="editor" data-slug="{{ slug }}">
    <div class="editor-split">
        <div class="editor-pane">
            <form id="editor-form" class="editor-form" method="post" action="/{{ slug }}/edit">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input class="editor-title" type="text" name="title" placeholder="Title" value="{{ title }}" {% if not title %}autofocus{% endif %}>
                <textarea class="editor-content" name="content" placeholder="Write something...&#10;&#10;**bold**  *italic*  [link](url)  ## heading" {% if title and not content %}autofocus{% endif %}>{{ content }}</textarea>
            </form>
        </div>
        <div class="editor-preview">
            <article class="page" id="preview"></article>
        </div>
    </div>
    <footer class="editor-footer">
        <a href="https://commonmark.org/help/" target="_blank" class="editor-markdown-link">Markdown</a>
        <div class="editor-actions">
            <a href="{% if is_new %}/{% else %}/{{ slug }}{% endif %}" class="btn btn--outline">Cancel</a>
            <button class="btn btn-publish" type="submit" form="editor-form">Publish</button>
        </div>
    </footer>
</div>
<script src="/static/editor.js"></script>
{% endblock %}
