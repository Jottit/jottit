{% extends "base.html" %}

{% block title %}Edit — Jottit{% endblock %}

{% block body %}
<div class="editor">
    <form id="editor-form" class="editor-form" method="post" action="/{{ slug }}/edit">
        <input class="editor-title" type="text" name="title" placeholder="Title" value="{{ title }}" autofocus>
        <textarea class="editor-content" name="content" placeholder="Write something...">{{ content }}</textarea>
    </form>
    <footer class="editor-footer">
        <label class="editor-draft">
            <input type="checkbox" name="draft" form="editor-form">
            Keep this a draft
        </label>
        <div class="editor-actions">
            <a href="/{{ slug }}" class="btn btn-outline">Cancel</a>
            <button class="btn btn-publish" type="submit" form="editor-form">Publish</button>
        </div>
    </footer>
</div>
{% endblock %}
