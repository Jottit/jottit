{% extends "base.html" %}

{% block title %}Edit — Jottit{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
{% endblock %}

{% block body %}
<div class="editor">
    <div class="editor-split">
        <div class="editor-pane">
            <form id="editor-form" class="editor-form" method="post" action="/{{ slug }}/edit">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if page_slug %}<input type="hidden" name="page" value="{{ page_slug }}">{% endif %}
                <input class="editor-title" type="text" name="title" placeholder="Title" value="{{ title }}" autofocus>
                <textarea class="editor-content" name="content" placeholder="Write something...">{{ content }}</textarea>
            </form>
        </div>
        <div class="editor-preview">
            <article class="page" id="preview"></article>
        </div>
    </div>
    <footer class="editor-footer">
        <label class="editor-draft">
            <input type="checkbox" name="draft" form="editor-form">
            Keep this a draft
        </label>
        <div class="editor-actions">
            <a href="/{{ slug }}" class="btn btn-outline">Cancel</a>
            <button class="btn btn-publish" type="submit" form="editor-form">Publish</button>
        </div>
    </footer>
</div>
<script>
var titleInput = document.querySelector('.editor-title');
var contentInput = document.querySelector('.editor-content');
var preview = document.getElementById('preview');
var siteSlug = '{{ slug }}';

function processWikilinks(text) {
    return text.replace(/\[\[([^\[\]]+)\]\]/g, function(match, name) {
        name = name.trim();
        if (!name) return match;
        var slug = name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
        if (!slug) return match;
        var display = name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return '<a href="/' + siteSlug + '/' + slug + '">' + display + '</a>';
    });
}

function updatePreview() {
    var title = titleInput.value;
    var body = contentInput.value;
    var html = '';
    if (title) html += '<h1>' + title.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</h1>';
    if (body) html += marked.parse(processWikilinks(body));
    preview.innerHTML = html;
}

titleInput.addEventListener('input', updatePreview);
contentInput.addEventListener('input', updatePreview);
updatePreview();
</script>
{% endblock %}
